name: ACL benchmarks

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  workflow_dispatch:
    inputs:
      full:
        description: Re-measure every implementation, ignoring saved fingerprints
        type: boolean
        default: false

permissions:
  contents: read

# Keep restoration, measurement and publication ordered on main.
concurrency:
  group: acl-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # PyPy measurements include warmups and five samples at n=500000.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        id: cpython
        with:
          python-version: '3.11'
      - uses: actions/setup-python@v7
        id: pypy
        with:
          python-version: 'pypy3.11-v7.3.20'
      - name: Create isolated benchmark environments
        id: runtimes
        env:
          BASE_CPYTHON: ${{ steps.cpython.outputs.python-path }}
          BASE_PYPY: ${{ steps.pypy.outputs.python-path }}
        run: |
          # setup-python can leave overlapping pip installations in its PyPy cache.
          # venv bootstraps pip from ensurepip without importing that base pip.
          "$BASE_CPYTHON" -m venv "$RUNNER_TEMP/acl-cpython"
          "$BASE_PYPY" -m venv "$RUNNER_TEMP/acl-pypy"
          cpython="$RUNNER_TEMP/acl-cpython/bin/python"
          pypy="$RUNNER_TEMP/acl-pypy/bin/python"
          "$cpython" -m pip install --upgrade 'pip==25.3'
          # PyPy bundles CFFI, whose pycparser dependency is absent in a fresh venv.
          "$pypy" -m pip install --upgrade 'pip==25.3' 'pycparser==2.23'
          "$cpython" -m pip install -r requirements-cffi.txt
          "$pypy" -m pip install -r requirements-cffi.txt
          "$cpython" -m pip install -r requirements-hpy.txt
          "$pypy" -m pip install -r requirements-hpy.txt
          # Import pip again in new processes so installation corruption fails early.
          "$cpython" -m pip --version
          "$pypy" -m pip --version
          "$cpython" -m pip check
          "$pypy" -m pip check
          echo "cpython=$cpython" >> "$GITHUB_OUTPUT"
          echo "pypy=$pypy" >> "$GITHUB_OUTPUT"
      - name: Test the harness
        env:
          PYTHON: ${{ steps.runtimes.outputs.cpython }}
        run: '"$PYTHON" -m unittest discover -s tests'
      - name: Build and test CFFI on both runtimes
        env:
          CPYTHON: ${{ steps.runtimes.outputs.cpython }}
          PYPY: ${{ steps.runtimes.outputs.pypy }}
          ACL_CFFI_REQUIRE_NATIVE: '1'
        run: |
          for python in "$CPYTHON" "$PYPY"; do
            native_path=$("$python" -m benchkit build --source cffi --print-path)
            PYTHONPATH="$native_path" "$python" -m unittest discover -s tests -p test_acl_cffi.py
          done
      - name: Build and test HPy Universal on both runtimes
        env:
          CPYTHON: ${{ steps.runtimes.outputs.cpython }}
          PYPY: ${{ steps.runtimes.outputs.pypy }}
          ACL_HPY_REQUIRE_NATIVE: '1'
        run: |
          for python in "$CPYTHON" "$PYPY"; do
            native_path=$("$python" -m benchkit build --source hpy --print-path)
            PYTHONPATH="$native_path" "$python" -m unittest discover -s tests -p test_acl_hpy.py
            HPY=debug PYTHONPATH="$native_path" "$python" -m unittest discover -s tests -p test_acl_hpy.py
          done
      - name: Build and test the standalone C++ reference
        env:
          PYTHON: ${{ steps.runtimes.outputs.cpython }}
        run: |
          binary=$("$PYTHON" -c 'from benchkit.cpp_reference import build; print(build()[0])')
          ACL_CPP_REFERENCE_BINARY="$binary" "$PYTHON" -m unittest discover -s tests -p test_cpp_reference.py
      - name: Validate harurun adapters on both runtimes
        env:
          CPYTHON: ${{ steps.runtimes.outputs.cpython }}
          PYPY: ${{ steps.runtimes.outputs.pypy }}
        run: |
          source_path=$("$CPYTHON" -m benchkit build --source harurun --print-path)
          for python in "$CPYTHON" "$PYPY"; do
            ACL_HARURUN_SOURCE="$source_path" "$python" -m unittest discover -s tests -p test_harurun.py
          done
      - name: Restore the last published measurements
        env:
          PYTHON: ${{ steps.runtimes.outputs.cpython }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$PYTHON" scripts/publish.py restore --results results
          # Do not carry old CPython measurements into the PyPy-only report.
          "$PYTHON" -c 'import shutil; shutil.rmtree("results/cpython", ignore_errors=True)'
      - name: Measure PyPy and C++ reference
        env:
          CPYTHON: ${{ steps.runtimes.outputs.cpython }}
          PYPY: ${{ steps.runtimes.outputs.pypy }}
          FULL: ${{ inputs.full || false }}
          PYTHONHASHSEED: '0'
        run: |
          args=()
          if [[ "$FULL" == "true" ]]; then
            args+=(--force)
          fi
          "$PYPY" -m benchkit run --results results "${args[@]}"
          "$CPYTHON" -m benchkit cpp-reference --results results "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: results/
          if-no-files-found: error
          retention-days: 14

  report:
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: results
      - name: Rebuild the graphs and report
        run: python -m benchkit report --results results --output site
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: site

  persist:
    needs: report
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-site
          path: site
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: results
      - name: Save measurements and SVGs to gh-pages
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: refs/heads/${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          python scripts/publish.py publish --site site --results results
          --source-ref "$SOURCE_REF" --source-sha "$SOURCE_SHA"

  deploy:
    needs: [report, persist]
    if: needs.persist.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
